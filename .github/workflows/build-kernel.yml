name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      select_device:
        description: 'Select device:'
        required: true
        type: choice
        options:
        - 'lancelot'
        - 'merlin'

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-24.04
    env:
      DEVICE: ${{ github.event.inputs.select_device }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
    - uses: actions/checkout@v4

    - name: Maximize build space
      if: env.REMOVE_UNUSED_PACKAGES == 'true'
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'

    - name: Prepare environment
      run: |
        grep -v -E "^#|^\n" config.env | sed 's/ #.*//; s/#.*//' >> $GITHUB_ENV

    - name: Set swap to 4G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 4

    - name: Setup kernel build environment
      run: |
        echo "BUILD_TIME=$(TZ=UTC date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libwxgtk3.2-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 binutils-arm-linux-gnueabi
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Clang
      if: env.USE_CLANG == 'true' && env.USE_GCC != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [[ ${{ env.CLANG_SOURCE }} == *'.git' ]]; then
            git clone ${{ env.CLANG_SOURCE }} -b ${{ env.CLANG_BRANCH }} clang --depth=1
        elif [[ ${{ env.CLANG_SOURCE }} == *'.tar.gz' ]]; then
            wget -nv -O clang.tar.gz ${{ env.CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -zxvf clang.tar.gz
            rm clang.tar.gz
        elif [[ ${{ env.CLANG_SOURCE }} == *'.tar.xz' ]]; then
            wget -nv -O clang.tar.xz ${{ env.CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -Jxvf clang.tar.xz
            rm clang.tar.xz
        elif [[ ${{ env.CLANG_SOURCE }} == *'.tar.zst' ]]; then
            wget -nv -O clang.tar.zst ${{ env.CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -I zstd -xf clang.tar.zst
            rm clang.tar.zst
        else
            wget -nv -O clang.zip ${{ env.CLANG_SOURCE }}
            mkdir clang
            unzip clang.zip -d clang/
            rm clang.zip
        fi
        if [[ "$(find ./clang -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
            mv -f "$(find ./clang -mindepth 1 -maxdepth 1 -type d)"/* ./clang
        fi

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: Setup KernelSU
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "$KERNELSU_SETUP_SOURCE" | bash -s ${{ env.KERNELSU_TAG }}
        KSU_VERSION="_$(cd $(echo "$KERNELSU_SETUP_SOURCE" | cut -d/ -f5) || cd KernelSU && expr $(git rev-list --count HEAD) + 10200)"
        echo "UPLOADNAME=-$(echo "$KERNELSU_SETUP_SOURCE" | cut -d/ -f5)$KSU_VERSION" >> $GITHUB_ENV

    - name: Setup Configuration for kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        # Disable 32-bit vDSO
        sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/g' arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
        echo "# CONFIG_COMPAT_VDSO is not set" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig

        # Lock vermagic to match /vendor modules
        sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/g' arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
        echo "# CONFIG_LOCALVERSION_AUTO is not set" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
        sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-openela-proton-g58eaf531fae9"/g' arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
        echo 'CONFIG_LOCALVERSION="-openela-proton-g58eaf531fae9"' >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig

        # Eliminate -dirty tag
        echo '#!/bin/sh' > scripts/setlocalversion
        echo 'echo "-openela-proton-g58eaf531fae9"' >> scripts/setlocalversion
        chmod +x scripts/setlocalversion

        if [ "${{ env.ENABLE_KERNELSU }}" = "true" ]; then
            echo "CONFIG_KSU=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
            echo "# CONFIG_KPROBES is not set" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
        fi
        if [ "${{ env.ADD_OVERLAYFS_CONFIG }}" = "true" ]; then
            echo "CONFIG_OVERLAY_FS=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
            echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
            echo "CONFIG_OVERLAY_FS_INDEX=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
        fi

        # Match stock LTO optimization to prevent vendor module ABI panic
        echo "CONFIG_LTO=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
        echo "CONFIG_LTO_CLANG=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig
        echo "CONFIG_THINLTO=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${DEVICE}_defconfig

    - name: Setup ccache
      if: env.ENABLE_CCACHE == 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-${{ env.DEVICE }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}
        max-size: 2G

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        # Inject KernelSU manual hooks cleanly inside function bodies
        if [ "${{ env.ENABLE_KERNELSU }}" = "true" ]; then
          python3 - << 'EOF'
        import sys

        def patch_after_brace(filepath, func_anchor, code):
            with open(filepath, 'r') as f:
                content = f.read()
            if code.strip() in content:
                return
            idx = content.find(func_anchor)
            if idx == -1:
                print(f"[WARN] {func_anchor} not found in {filepath}")
                return
            brace_idx = content.find('{', idx)
            if brace_idx == -1:
                print(f"[WARN] Opening brace not found after {func_anchor} in {filepath}")
                return
            content = content[:brace_idx + 1] + "\n" + code + "\n" + content[brace_idx + 1:]
            with open(filepath, 'w') as f:
                f.write(content)
            print(f"[OK] Patched {filepath}")

        # Hook 1: fs/exec.c
        patch_after_brace('fs/exec.c',
            'static int do_execveat_common(',
            '#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif')

        # Hook 2: fs/open.c
        patch_after_brace('fs/open.c',
            'long do_faccessat(',
            '#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\nksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif')

        # Hook 3: fs/read_write.c
        patch_after_brace('fs/read_write.c',
            'ssize_t vfs_read(',
            '#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\nif (unlikely(ksu_vfs_read_hook)) ksu_handle_sys_read(0, &buf, &count);\n#endif')

        # Hook 4: fs/stat.c
        patch_after_brace('fs/stat.c',
            'int vfs_fstatat(',
            '#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nksu_handle_stat(&dfd, &filename, &flag);\n#endif')

        # Hook 5: kernel/reboot.c
        patch_after_brace('kernel/reboot.c',
            'SYSCALL_DEFINE4(reboot,',
            '#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\nksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif')
        EOF
        fi

        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)

        if [ -n "${{ env.KSU_EXPECTED_SIZE }}" ] && [ -n "${{ env.KSU_EXPECTED_HASH }}" ]; then
          export KSU_EXPECTED_SIZE=${{ env.KSU_EXPECTED_SIZE }}
          export KSU_EXPECTED_HASH=${{ env.KSU_EXPECTED_HASH }}
        fi

        make -j$(nproc --all) CC=clang O=out ARCH=${{ env.KERNEL_ARCH }} ${{ env.EXTRA_CMDS }} ${DEVICE}_defconfig
        make -j$(nproc --all) CC=clang O=out ARCH=${{ env.KERNEL_ARCH }} ${{ env.EXTRA_CMDS }}

    - name: Check a kernel output files
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ -f android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} ]; then
            echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
        else
            echo "Kernel output file is empty"
            exit 1
        fi

    - name: Create flashable Anykernel3 zip
      if: env.CHECK_FILE_IS_OK == 'true' && env.USE_ANYKERNEL3 == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.ANYKERNEL3_SOURCE }} -b ${{ env.ANYKERNEL3_BRANCH }} --depth=1 AnyKernel3
        cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/

        # Copy matching compiled DTB for Header Version 2 boot images
        if [ -f android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtb ]; then
            cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtb AnyKernel3/dtb
        elif [ -f android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dts/mediatek/mt6768.dtb ]; then
            cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dts/mediatek/mt6768.dtb AnyKernel3/dtb
        else
            find android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/ -name "*6768*.dtb" -o -name "*${DEVICE}*.dtb" -o -name "*.dtb" | head -n 1 | xargs -I{} cp {} AnyKernel3/dtb
        fi

        # Pack any compiled kernel modules to replace the stock vendor modules
        mkdir -p AnyKernel3/modules/vendor/lib/modules
        find android-kernel/out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;

        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Upload AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/AnyKernel3/*
